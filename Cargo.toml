[package]
name = "mote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Immutable op-maildir issue + coordination tracker"
license = "MIT OR Apache-2.0"
exclude = [".claude/scheduled_tasks.lock"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
jiff = { version = "0.2", features = ["serde"] }
notify = "7"
ratatui = "0.29"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
